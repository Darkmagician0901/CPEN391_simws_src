# Global parameter file for the milestone1 package.
#
# Loaded by launch/milestone1_py.py and passed to every node, so all tuning
# happens here. After editing, rebuild (colcon build) or use
# `colcon build --symlink-install` so the installed copy follows this file.
#
# Individual values can also be changed at runtime, e.g.
#     ros2 param set /pid kp 1.2
#
# NOTE: the type in this file must match the type of the default in
# declare_parameter(). Floats need a decimal point (1.0, not 1). Integers
# (neighbor_count) must NOT have one (2, not 2.0). rclpy rejects a mismatch.
#
# NOTE: a key that the node never declares is silently ignored. If you rename
# or remove a parameter in the code, update this file too, or the node will
# quietly run on its hard-coded default.

# ---------------------------------------------------------------------------
# Shared by all nodes: topic names
# ---------------------------------------------------------------------------
# Data flow:
#   /scan + /ego_racecar/odom --> dist_finder --> /wall_error --> pid --> /drive_request
#   /drive_request + /scan + /ego_racecar/odom --> safety_node --> /drive
#
# Only safety_node publishes on /drive, so a brake can never be overruled.
/**:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /ego_racecar/odom
    error_topic: /wall_error
    drive_request_topic: /drive_request
    drive_topic: /drive

# ---------------------------------------------------------------------------
# dist_finder: LiDAR -> wall distance error
# ---------------------------------------------------------------------------
dist_finder:
  ros__parameters:
    wall_side: left            # which wall to follow: 'left' or 'right'
    desired_distance: 1.2      # m, target distance to the wall
    theta: 42.0                # deg, angle between beam b (90 deg) and beam a, in (0, 90)
    neighbor_count: 2          # int, beams on each side averaged when a reading is invalid

    # Dynamic lookahead: L = |v| * lookahead_time, clipped to
    # [min_lookahead, max_lookahead]. With min == max, L is fixed at that value.
    # To make L scale with speed, keep max_lookahead >= fast_speed * lookahead_time.
    lookahead_time: 0.5        # s
    min_lookahead: 1.7         # m
    max_lookahead: 1.7         # m

# ---------------------------------------------------------------------------
# pid: wall distance error -> steering and speed
# ---------------------------------------------------------------------------
pid:
  ros__parameters:
    kp: 0.8
    ki: 0.1
    kd: 0.45
    max_steering_angle: 0.75   # rad (~43 deg); the f1tenth_gym car itself is limited to 0.4189 rad (24 deg)
    integral_limit: 0.5        # anti-windup clamp on the integral term

    # Linear speed ramp based on |steering angle|.
    # large_angle must be below the physical limit (~24 deg), or the car
    # reaches full lock while still going fast.
    small_angle: 5.0           # deg, at or below this: fast_speed
    large_angle: 30.0          # deg, at or above this: slow_speed
    fast_speed: 10.0           # m/s
    slow_speed: 6.5            # m/s, speed ramps linearly in between

# ---------------------------------------------------------------------------
# safety_node: TTC-based AEB, final gate on /drive
# ---------------------------------------------------------------------------
safety_node:
  ros__parameters:
    ttc_threshold: 0.35        # s, brake when min iTTC is below this
    car_width: 0.34            # m, width of the path used to filter beams
    min_closing_speed: 1.0e-6  # m/s, beams closing slower than this are ignored
